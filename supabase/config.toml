project_id = "monkey-town-uren"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/"]
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = false
enable_confirmations = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 600

[auth.email.template.magic_link]
subject = "Je inlogcode voor Monkey Town"
content_path = "./supabase/templates/login.html"

[auth.email.template.invite]
subject = "Je uitnodiging voor Monkey Town"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Herstel je wachtwoord voor Monkey Town"
content_path = "./supabase/templates/recovery.html"

[functions.invite]
verify_jwt = false

[functions.closing-mail]
verify_jwt = false
